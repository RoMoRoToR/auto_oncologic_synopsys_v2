services:
  bioequiv-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "8000:8000"
    environment:
      # критично: джоба сейчас "умирает" раньше RAG
      JOB_TIMEOUT_S: 300
      RAG_TIMEOUT_S: 180

      JOBS_WORKERS: 2

      # опционально, чтобы PDF-парсер не был слишком агрессивным
      PDF_TIMEOUT_S: 180
      MAX_PDF_MB: 30
      SYNOPSIS_USE_LLM: 1

      DB_PATH: /app/data/app.db
      ARTIFACT_DIR: /app/data/artifacts
      GRLS_XLSX_PATH: /app/data/grls.xlsx

      TAVILY_API_KEY: ${TAVILY_API_KEY}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID}
      YANDEX_AUTH_KEY: ${YANDEX_AUTH_KEY}
    volumes:
      - ./data:/app/data
