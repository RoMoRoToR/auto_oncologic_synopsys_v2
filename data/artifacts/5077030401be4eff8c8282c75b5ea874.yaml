protocolTitle: "Синопсис протокола исследования биоэквивалентности: VISMODEGIB 150 мг (натощак)"
protocolNumber: BE-VIS-2026
sponsor: 
clinicalCenter: 
bioanalyticalLab: 
clinicalPhase: I
investigationalProduct: Тестируемый препарат VISMODEGIB 150 мг
activeSubstance: VISMODEGIB
dosageForm: Таблетки, 150 мг
objectives: Оценить биоэквивалентность тестируемого и референтного препаратов VISMODEGIB по параметрам Cmax и AUC при приёме натощак.
tasks:
  - Сравнить Cmax и AUC0-t (и при возможности AUC0-∞) после лог-трансформации.
  - Оценить Tmax описательно.
  - Оценить безопасность и переносимость (НЯ, жизненные показатели, лабораторные показатели).
design: Рандомизированное, открытое, двухпериодное, двухпоследовательностное перекрёстное исследование (2×2 cross-over).
methodology: "Отбор проб крови проводится в каждом периоде до 72 ч после дозирования (плотнее вокруг Tmax=— ч; t1/2=— ч). Предлагаемая сетка точек (ч): 0, 0.25, 0.5, 1, 1.5, 2, 3, 4, 6, 8, 12, 24, 36, 48, 72."
population: Здоровые добровольцы (мужчины и/или женщины) согласно критериям включения/исключения.
inclusionCriteria:
  - Подписанное информированное согласие.
  - Возраст 18–55 лет.
  - ИМТ 18.5–30.0 кг/м².
  - Отсутствие клинически значимых отклонений по обследованиям и анализам.
exclusionCriteria:
  - Гиперчувствительность к действующему веществу или компонентам препарата.
  - Приём лекарств, влияющих на фармакокинетику, в период скрининга/отмывки.
  - Значимые хронические заболевания (печени, почек, ССС и др.).
  - Участие в другом клиническом исследовании в последние 3 месяца.
withdrawalCriteria:
  - Добровольный отказ участника.
  - Развитие нежелательных явлений, требующих вывода из исследования.
  - Нарушение протокола, влияющее на интерпретацию результатов.
testProductRegimen: Однократный приём тестируемого препарата 150 мг натощак с 240 мл воды.
referenceProductRegimen: Однократный приём референтного препарата 150 мг натощак с 240 мл воды.
studyPeriods: 2 период(а/ов), 2 последовательности(ей), washout 7 дней
duration: Скрининг до 28 дней; периоды согласно дизайну; финальный визит после завершения отбора проб.
pkParameters: Cmax, AUC0-t, AUC0-∞ (при наличии), Tmax (описательно)
analyticalMethod: Валидационный биоаналитический метод LC-MS/MS для определения концентраций действующего вещества в плазме.
beCriteria: 90% ДИ для отношения геометрических средних (T/R) по ln(Cmax) и ln(AUC0-t) в пределах 80.00–125.00%.
safetyAnalysis: Оценка НЯ/СНЯ, физикальные осмотры, жизненные показатели, ЭКГ, клинические и биохимические анализы крови/мочи.
sampleSizeCalculation: "Расчёт выполнен для 90% ДИ (α=0.05) и мощности 80%. Использован CVintra=25%. Требуется завершивших: 20; к скринингу: 32 (с учётом drop-out/screen-fail из входных параметров)."
randomization: "Рандомизация 1:1 по последовательностям (TR/RT) блоками; распределение фиксируется в системе."
ethicalAspects: Исследование проводится в соответствии с GCP, Хельсинкской декларацией и локальными требованиями. Обязательно информированное согласие.
versionDate: 2026-02-25
